[package]
name = "openuur"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "UU Remote native terminal client and host"
license = "MIT"
readme = "README.md"
default-run = "openuur"

[features]
default = ["desktop"]
# Wayland capture through xdg-desktop-portal + PipeWire. Disable it with
# `--no-default-features` to build a terminal-only host without PipeWire or
# libclang development headers.
desktop = ["dep:lamco-pipewire", "dep:x11rb"]

[lib]
name = "openuur"
path = "src/lib.rs"

[[bin]]
name = "openuur"
path = "src/bin/openuur.rs"

[[bin]]
name = "openuurd"
path = "src/bin/openuurd.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
kcp = "0.6"
hmac = "0.12"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rustls = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webrtc = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["remote_desktop", "screencast", "clipboard"] }
lamco-portal = "0.4"
lamco-pipewire = { version = "0.8", default-features = false, optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["dpms", "xtest", "randr", "damage", "shm", "xfixes"], optional = true }


# UU interop needs the post-handshake DTLS delivery fix from this vendored 0.9.0 copy.
[patch.crates-io]
webrtc-dtls = { path = "vendor/webrtc-dtls" }
# Larger data-channel receive buffer (200 KiB file-transfer blocks) and an
# SCTP send limit that matches the advertised a=max-message-size.
webrtc = { path = "vendor/webrtc" }
